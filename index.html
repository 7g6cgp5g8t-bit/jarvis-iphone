<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#030914">

<title>J.A.R.V.I.S.</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:radial-gradient(ellipse at 50% 30%,#12365d,#030914 70%);color:#e8faff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}

main{max-width:520px;margin:auto;padding:25px 20px}

header{display:flex;justify-content:space-between;letter-spacing:3px;color:#65eaff;font-size:14px}

.core{height:280px;display:grid;place-items:center;position:relative}

.orb{width:165px;height:165px;border-radius:50%;background:radial-gradient(circle,#eaffff 0%,#54eaff 5%,#1177d9 25%,#06162d 65%);box-shadow:0 0 35px #25cfff,0 0 90px #067aff80;animation:pulse 3s infinite}

.ring{position:absolute;width:215px;height:215px;border:1px solid #5ceaff99;border-radius:50%;transform:rotateX(65deg);animation:spin 12s linear infinite}

@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.4)}}

@keyframes spin{to{transform:rotate(360deg) rotateX(65deg)}}

h1{text-align:center;letter-spacing:6px;font-size:24px}

.sub{text-align:center;color:#80b4d0;font-size:13px;margin-bottom:25px}

.panel{border:1px solid #45dfff55;background:#071727d9;border-radius:18px;padding:16px}

#log{height:180px;overflow:auto;font-size:14px;line-height:1.5}

.msg{white-space:pre-wrap}

.msg b{color:#59e9ff}

form{display:flex;gap:8px}

input{width:100%;min-width:0;background:#020a15;border:1px solid #326b8b;border-radius:12px;padding:13px;color:white;font-size:16px}

button{background:#0d3553;color:white;border:1px solid #4ddfff88;border-radius:12px;padding:12px;font-size:15px}

.controls{display:flex;gap:10px;margin-top:12px}

.controls button{flex:1}

.note{color:#8aaabe;font-size:12px;line-height:1.5}

</style>

</head>

<body>

<main>

<header><b>J.A.R.V.I.S.</b><span id="status">● BEREIT</span></header>

<div class="core"><div class="ring"></div><div class="orb"></div></div>

<h1>ICH HÖRE ZU.</h1>

<div class="sub">Persönlicher Assistent · iPhone Edition</div>

<section class="panel">

<div id="log" aria-live="polite"><p class="msg"><b>JARVIS:</b> Guten Abend. Ich bin bereit für dich.</p></div>

<form id="form"><input id="input" placeholder="Sprich mit JARVIS …" autocomplete="off"><button>Senden</button></form>

<div class="controls"><button id="mic" type="button">🎙 Sprechen</button><button id="voice" type="button">🔊 Stimme testen</button></div>

</section>

<p class="note" id="note">Prototyp: Noch keine KI-Verbindung. Mikrofon und Sprache benötigen Browserunterstützung und gegebenenfalls deine Freigabe.</p>

</main>

<script>

const $=id=>document.getElementById(id);

let last="Guten Abend. Ich bin bereit. Was kann ich für dich tun?";

function add(who,text){let p=document.createElement("p");p.className="msg";let b=document.createElement("b");b.textContent=who+": ";p.append(b,document.createTextNode(text));$("log").append(p);$("log").scrollTop=$("log").scrollHeight}

function speak(text){if(!("speechSynthesis" in window)){$("note").textContent="Sprachausgabe nicht verfügbar.";return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.86;u.pitch=.68;let v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang.toLowerCase().startsWith("de"))||null;speechSynthesis.speak(u)}

function answer(text){let q=text.toLowerCase(),a;if(/hallo|guten abend|guten morgen/.test(q))a="Guten Abend. Ich bin bereit. Meine KI-Verbindung ist noch nicht eingerichtet.";else if(/wer bist du/.test(q))a="Ich bin JARVIS, dein persönlicher Assistent im Aufbau.";else a="Ich habe dich gehört. Für intelligente Antworten muss zuerst eine sichere KI-Verbindung eingerichtet werden.";last=a;add("JARVIS",a);speak(a)}

$("form").addEventListener("submit",e=>{e.preventDefault();let t=$("input").value.trim();if(!t)return;add("DU",t);$("input").value="";answer(t)});

$("voice").onclick=()=>speak(last);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SR){let r=new SR();r.lang="de-DE";r.onstart=()=>{$("status").textContent="● ICH HÖRE"};r.onend=()=>{$("status").textContent="● BEREIT"};r.onerror=e=>{$("note").textContent="Mikrofon/Spracherkennung: "+e.error};r.onresult=e=>{let t=e.results[0][0].transcript;add("DU",t);answer(t)};$("mic").onclick=()=>{try{r.start()}catch(e){$("note").textContent="Bitte kurz warten und erneut versuchen."}}}else{$("mic").onclick=()=>$("note").textContent="Spracherkennung wird von diesem Browser nicht unterstützt. Du kannst Text eingeben."}

</script>

</body>

</html>
